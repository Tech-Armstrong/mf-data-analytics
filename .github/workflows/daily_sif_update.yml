name: Daily SIF Update

on:
  schedule:
    # 11:30 PM IST = 18:00 UTC, Mon–Fri. AMFI publishes NAVs ~8–11 PM IST, so
    # this is the first slot where the day's data is reliably complete.
    #
    # Was "30 9 * * 1-5" (3 PM IST) during testing, which ran before publication
    # and so routinely fetched nothing. That silently loses days: NAVAll.txt only
    # ever carries the latest date, so a missed run cannot be recovered by the
    # next one -- it needs a backfill from the history endpoint. Two days
    # (19-20 Aug 2026) were lost this way before the schedule was corrected.
    - cron: "0 18 * * 1-5"

  workflow_dispatch:          # allow manual trigger from GitHub UI
    inputs:
      force:
        description: "Re-load today's SIF NAVs even if already on Blob"
        type: boolean
        required: false
        default: false

jobs:
  update-sif-nav:
    runs-on: ubuntu-latest
    # No contents:write needed — data lives in Azure Blob, not git.

    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Daily SIF update: fetch → upload raw + merge current-year partition ──
      # Reads/writes parquet directly to the sifnavdata Azure Blob container.
      # Also refreshes scheme_master so new SIFs are labelled automatically.
      - name: Daily SIF update
        run: python -m sif.scripts.fetch.daily_sif_update ${{ inputs.force && '--force' || '' }}
